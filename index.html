<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하랑의 생일 기념 롤링페이퍼</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Gamja+Flower&family=Nanum+Pen+Script&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        /* 전체 화면 배경 */
        body 
        {
            background-color: #f8f1e5; 
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 제목 */
        h1 
        {
            font-family: 'Jua', sans-serif;
            color: #8d6e63;
            /* 제목 글씨 뒤 그림자(살짝 튀어나와 보이게 하는 효과) */
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5); 
            margin: 0 0 25px 0;
            font-size: 2.2rem;
        }

        /* 롤링페이퍼 보드: Flex 레이아웃으로 자동 정렬 */
        #rolling-paper-board 
        {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            align-items: flex-start; /* 높이 동기화 현상 차단  */
            gap: 35px 25px; /* 메모지 간 상하, 좌우 간격 보장 */
            width: 100%;
            max-width: 1050px;
            min-height: 70vh;
            background-color: rgba(255, 255, 255, 0.6);
            border: 6px solid #d7ccc8; /* 보드 테두리 */
            border-radius: 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.06);
            padding: 40px 30px; /* 상하좌우 안전 여백으로 잘림 원천 차단 */
        }

        /* ---1page 개별 메시지 포스트잇 */
        .message 
        {
            position: relative;
            width: 310px; /* 장문에 맞춰 가로 폭 확장 */
            min-height: 130px; /* 최소 세로 높이 */
            height: fit-content; /* 글자 길이에만 딱 맞게 세로 길이 자동 조절 */
            padding: 22px 18px 14px; /* 상단 테이프 자리 확보 및 여백 */
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.12);

            font-family: 'Gamja Flower', cursive;
            font-size: 17px;
            line-height: 1.6;
            cursor: pointer;
            user-select: none;
            color: #333; /* 포스트잇 본문 및 작성자 글씨 */

            white-space: pre-line; /* 백틱 안의 줄바꿈(엔터)을 화면에 그대로 반영 */
            word-break: break-all; /* 단어가 길어도 메모지 밖으로 삐져나가지 않게 강제 줄바꿈 */
            text-align: left; /* 장문 가독성을 위해 왼쪽 정렬 */

            /* 세로 배치 (본문은 위, 작성자는 아래)*/
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .message:hover 
        {
            /* 포스트잇이나 편지지 바닥에 깔리는 그림자 */
            box-shadow: 4px 10px 20px rgba(0,0,0,0.22);

            z-index: 50 !important;
        }

        /* 테이프 자국 */
        .message::before 
        {    
            content: '';
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 18px;
            background-color: rgba(255, 255, 255, 0.75);
            border: 1px dashed rgba(0, 0, 0, 0.15);
        }

        /* --- 2page: 긴 편지지 스타일 --- */
        .long-letter 
        {
            width: 100%;
            max-width: 960px;
            min-height: 50vh;
            background-color: #fffdf7; /* 바탕색 */
            padding: 40px 50px;

            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0d0b5; /* 얇은 외각선 색 */

            font-family: 'Nanum Pen Script', cursive;
            font-size: 24.7px;
            line-height: 1.9;
            color: #444; /* 2페이지 본문 글자색 */

            white-space: pre-line; /* 엔터 줄바꿈 인식 */
            margin: 0 auto; /* 중앙 정렬 */
        }

        /* 하단 페이지 버튼 */
        #pagination-controls 
        {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            color: #795548 /* 하단 페이지 텍스트 */
        }

        #pagination-controls button 
        {
            background-color: #8d6e63;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s
        }

        #pagination-controls button:hover:not(:disabled) 
        {
            background-color: #8d6e63;
        }

        #pagination-controls button:disabled 
        {
            background-color: #d7ccc8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- 부드러운 페이드 & 슬라이드 전환 효과 --- */
        @keyframes fadeOutUp 
        {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes fadeInDown 
        {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .page-exit 
        {
            animation: fadeOutUp 0.3s forwards ease-in;
        }
        
        .page-enter 
        {
            animation: fadeInDown 0.4s forwards ease-out;
        }

    </style>
</head>
<body>

        // 2페이지용: 긴 편지
        const longLetter =

        // 포스트잇 색깔
        const colorThemes = [
            { bg: "#fff9c4", border: "#fbc02d" }, // 레몬
            { bg: "#ffe0b2", border: "#ffa726" }, // 피치
            { bg: "#e1f5fe", border: "#4fc3f7" }, // 하늘

        let currentPage = 1;

        function renderBoard() 
        {
            const board = document.getElementById('rolling-paper-board');
            if (!board) return;

            board.innerHTML = '';
            
            try
            {
                // [1페이지 렌더링]: 포스트잇 목록 생성
                if (currentPage === 1) 
                {
                    stickyMessages.forEach((item, index) => 
                    {
                        const messageEl = document.createElement('div');
                        messageEl.className = 'message';
                        
                        const authorStyle = (item.author.includes('Aube'))
                            ? "font-family: 'Alex Brush', cursive; font-size: 24px; font-weight: normal;"
                            : "font-family: 'Gamja Flower', cursive; font-size: 16px; font-weight: bold;";

                        messageEl.innerHTML = `
                        <div style="flex-grow: 1; width: 100%;">${item.text}</div>
                        <div style="width: 100%; text-align: right; 
                                    margin-top: 10px; 
                                    font-weight: bold; 
                                    color: #555;
                                    ${authorStyle}">- ${item.author}</div>
                        `;
            
                        // 색상 테마 배정
                        const theme = colorThemes[index % colorThemes.length];
                        messageEl.style.backgroundColor = theme.bg;
                        messageEl.style.borderBottom = `3px solid ${theme.border}`;

                        // 자연스러운 손맛을 위한 미세 오차 부여 (회전 -6~6도, 상하 미세이동 -8~8px)
                        const rotate = (Math.random() - 0.5) * 12;
                        const translateY = (Math.random() - 0.5) * 16;
                    
                        messageEl.style.transform = `translateY(${translateY}px) rotate(${rotate}deg)`;

                        // 마우스 호버 인터랙션
                        messageEl.addEventListener('mouseenter', () => {
                            messageEl.style.transform = `translateY(${translateY - 5}px) rotate(${rotate}deg) scale(1.06)`;
                        });
                        messageEl.addEventListener('mouseleave', () => {
                            messageEl.style.transform = `translateY(${translateY}px) rotate(${rotate}deg) scale(1)`;
                        });

                        board.appendChild(messageEl);
                    });

                } 
               
                else if (currentPage === 2) 
                {
                    // [2페이지 렌더링]: 긴 편지 하나만 생성
                    const letterEl = document.createElement('div');
                    letterEl.className = 'long-letter';

                    letterEl.innerHTML = longLetter.trim();

                    board.appendChild(letterEl)
                }
            }

            catch (error)
            {
                board.innerHTML = `<div style="color:red; font-size:18px;">
                    렌더링 중 에러 발생: ${error.message}</div>`;
            }

            updatePaginationUI();
        }

        function updatePaginationUI()
        {
            const pageInfo = document.getElementById('page-info');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            if (pageInfo) pageInfo.innerText = `${currentPage} / 2`;
            if (prevBtn) prevBtn.disabled = (currentPage === 1);
            if (nextBtn) nextBtn.disabled = (currentPage === 2);
        }

        /*function changePage(pageNum)

            currentPage = pageNum;

        let isAnimating = false; // 애니메이션 도중 광클 방지 잠금장치

        function changePage(pageNum)
        {
            // 이미 애니메이션 중이거나, 현재 페이지와 같은 번호를 누르면 무시함
            if (isAnimating || currentPage === pageNum) return;
            isAnimating = true;

            const board = document.getElementById('rolling-paper-board');

            // 1. 현재 화면을 살짝 위로 올라가면서 부드럽게 투명해짐(페이드 앤 슬라이드)
            board.className = 'page-exit'

            // 2. 0.3초 뒤(화면이 안 보일 때) 내용물 교체 및 스크롤 이동
            setTimeout
            (
                () => 
                {
                    currentPage = pageNum;
                    renderBoard(); // 화면 안의 내용(포스트잇 <-> 긴 편지) 교체

                    // 내용이 바뀔 때 스크롤을 상단으로 끌어올림.
                    window.scrollTo({ top: 0, behavior: 'auto'});

                    // 3. 내용이 바뀐 뒤, 새 종이가 날아와서 붙는 애니메이션 시작
                    board.className = 'page-enter';

                    // 4. 애니메이션이 끝나면 상태 초기화
                    setTimeout
                    (
                        () =>
                        {
                            board.className = '';
                            isAnimating = false;
                        }, 400
                    );
                }, 300
            );
        }

        renderBoard()
    </script>
</body>
</html>
