<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하랑의 생일 기념 롤링페이퍼</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body 
        {
            background-color: #f8f1e5;
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 
        {
            font-family: 'Jua', sans-serif; 
            color: #8d6e63;
            text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
            margin: 0 0 25px 0;
            font-size: 2.2rem;
        }

        /* 롤링페이퍼 보드: Flex 레이아웃으로 자동 정렬 */
        #rolling-paper-board 
        {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            align-items: flex-start; /* 높이 동기화 현상 차단  */
            gap: 35px 25px; /* 메모지 간 상하, 좌우 간격 보장 */
            width: 100%;
            max-width: 1050px;
            min-height: 70vh;
            background-color: rgba(255, 255, 255, 0.6);
            border: 6px solid #d7ccc8;
            border-radius: 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.06);
            padding: 40px 30px; /* 상하좌우 안전 여백으로 잘림 원천 차단 */
        }

        /* ---1page 개별 메시지 포스트잇 */
        .message 
        {
            position: relative;
            width: 250px; /* 장문에 맞춰 가로 폭 확장 */
            min-height: 130px; /* 최소 세로 높이 */
            height: fit-content; /* 글자 길이에만 딱 맞게 세로 길이 자동 조절 */
            padding: 22px 18px 14px; /* 상단 테이프 자리 확보 및 여백 */
            border-radius: 6px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.12);

            font-size: 15px;
            line-height: 1.6;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            color: #333;

            white-space: pre-line; /* 백틱 안의 줄바꿈(엔터)을 화면에 그대로 반영 */
            word-break: break-all; /* 단어가 길어도 메모지 밖으로 삐져나가지 않게 강제 줄바꿈 */
            text-align: left; /* 장문 가독성을 위해 왼쪽 정렬 */

            /* 세로 배치 (본문은 위, 작성자는 아래)*/
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .message:hover 
        {
            box-shadow: 4px 10px 20px rgba(0,0,0,0.22);
            z-index: 50 !important;
        }

        /* 테이프 자국 */
        .message::before 
        {    
            content: '';
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 18px;
            background-color: rgba(255, 255, 255, 0.75);
            border: 1px dashed rgba(0, 0, 0, 0.15);
        }

        /* --- 2page: 긴 편지지 스타일 --- */
        .long-letter 
        {
            width: 100%;
            max-width: 1100px;
            min-height: 50vh;
            background-color: #fffdf7;
            padding: 40px 50px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0d0b5;
            font-size: 17px;
            line-height: 1.9;
            color: #444;
            white-space: pre-line; /* 엔터 줄바꿈 인식 */
            margin: 0 auto; /* 중앙 정렬 */
        }

        /* 하단 페이지 버튼 */
        #pagination-controls 
        {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-family: 'Jua', sans-serif;
            font-size: 1.2rem;
            color: #795548
        }

        #pagination-controls button 
        {
            background-color: #8d6e63;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s
        }

        #pagination-controls button:hover:not(:disabled) 
        {
            background-color: #8d6e63;
        }

        #pagination-controls button:disabled 
        {
            background-color: #d7ccc8;
            cursor: not-allowed;
            box-shadow: none;
        }

    </style>
</head>
<body>

    <h1>17번째 생일인 하랑이를 위한 우리의 마음</h1>

    <div id="rolling-paper-board"></div>

    <div id = "pagination-controls">
        <button id = "prev-btn" onclick = "changePage(1)"> ◀ </button>
        <span id = "page-info"> 1 / 2 </span>
        <button id = "next-btn" onclick = "changePage(2)"> ▶ </button>
    </div>

    <script>
        const stictyMessages = [
            {
                author: "파편",
                text: `축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!
                축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!
                축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!
                축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!
                축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!축하해!@@!!`
            },

            {
                author: "별하",
                text: `To. 하랑님
                하랑님 안녕하세여 저 별하입니다
                뭐 딱히 대화도 한번 안해봤지만 
                앞으로 친해질수 있기를 바라고 
                생일 축하드려요! 행복한 하루 보내세요!`
            },

            {
                author: "아리",
                text: `생축!`
            },

            {
                author: "이연",
                text: `생일 축하해요, 
                좋은 하루 보내시길`
            },

            {
                author: "도화지",
                text: `임하랑씌 생일 축하한다 
                니 안지 얼마 안된거 같은데 
                벌써 1년넘고 너의 생일이 왔구나 
                그사이에 음 여러 사건(?)이있었지만 
                우리 다 극복하고 같이 지내온거 같다 
                내가 뭐 많이 해준거 없는거 같은데 
                넌 나한데 많이 해준거 많은거 같다 
                생일축하한다~~`
            },

            {
                author: "Selena Aube",
                text: `하랑씨!!!!!!!생일축하해요!!@!!!!!!!!!!! 
                햅피!!!@!!!!!!! 벌스데이!!!!!@!!!@!!!!!!!!!
                그대를 진심으로 축하합니다악!!!!!!!!!@!!!!@@!!!!!!!! 
                언젠가 이야기 해보고싶어요!!!!@!!!!!! 
                생신축하드려요!!!!!!!!!!!@!!!!!`
            },

            {
                author: "구미호 이설",
                text: `To.아가 백호
                생일 축하하고 1개월만에 구독자 80명?는거 실화? 
                미친거지 암튼 곧 구독자 100명도 축하고 생일도 축하고 
                운로언니랑 우댜댜댜 재밋게 보내고 마싯는거 많이 먹고 
                조은시간 보내 빠빠이`
            }

        ];

        // 2페이지용: 긴 편지
        const longLetter = 
            `안녕 하랑아!! 생일축하한다!! 
            우리가 처음 본지 벌써 1년이 넘었네! 
            내 데뷔부터 봤다고 했으니 아마 403일쯤 되었을거야. 
            신기하다… 내 첫 시청자와 첫 우결자가 너 라는게… 참 운명같다… 
            내 집에 온 온라인 친구도 네가 처음이다. 
            나는 네가 처음으로 내 방송에 와줬던 그날이 잊혀지지가 않는다. 
            인생 첫 훈수도 듣고… 네 마크서버에 들어간것도 새록새록하다. 
            그때부터 네 생일을 알고있었어. 누가봐도 네 마크 닉네임이 0913이었으니까… 
            그때는 한창 입시 할때였고, 여러 가지로 방송을 자주키지 못했었는데, 
            이번에 네가 돌아와서 정말 기뻤어. 많이 전화도 하고, 방송도 했고, 게임도 했지! 
            그냥 장난스럽게 건넨 우결에 응해줘서(?) 참 고마워. 
            뭐… 반 강제여서 어쩔수 없었다는 말은… 우씨 그래서 후회하냐?!(후회한다면 후회하게해주지) 아무튼 말이다. 
            여기는 내가 유승님을 끌어들여 같이 노동한… 내가 자습시간부터 새벽까지(아님. 그 다음날 새벽까지 붙잡고 씨름할 예정) 
            코드 붙잡고 씨름해서 만든 사이트다.(덕분에 깃허브 잔디가 늘어났다는 기쁘지만 슬픈이야기) 
            음악도 내가 조물조물 손좀 봤고! (들었으려나. 듣고와라!)  그림도 그려봤다! 
            로딩 페이지에 나온 센터에 있는 그림 그거. 1시간 넘게 그렸는데 5초만에 지나간다고 못봤지? 
            나 카빵이랑 노는시간에 이런거 준비하고! 만들었다. 짱이지?! 
            내가 못하는건 요리밖에 없다구!! 앞으로 많이 웃고 힘들땐 서로 기대가며 지낼수있는 파트너가 되자.(쑥스러워서 그렇다!!! 메가메가베스트보이프렌드라는것정도는 잊지않았지) 
            내가 표현은 잘 못해도, 넌 내게 아주 소중한 사람이다.(정말 무슨말을 적을지 몰라서 고민하면서도 AI는 손도 안댔다. 유승님이 증인이다. 적을게 너무 많지만… 적당히 해야겠지) 
            내가 이번에는 너를 만나러 가지 못했지!!! 그치만 기다려라!!! 곧이다 곧. 
            어른이 되기까지 정말 얼마 안남았단말이다! 
            새벽에 쓰느라 조금 정신이 온전치 못하지만 이건 진심이다!! 
            사실 이 사이트에 같이찍은 인생네컷 넣고싶었는데 말이지. 그건… 간직하는걸로 하자. 
            그때 내가 너무 못생겼었거든. 이쁠때 다시 찍기로 약속!!! 
            나 밤새 코딩했다(생색) 칭찬. 감동먹었으면 좋겠다. 
            케이크는 못만들어서… 여러가지 준비해봤는데 마음에 들지는 모르겠네. 
            생일 축하하고, 맛있는 거 많이 먹고, 영원처럼 행복해라. 
            いつもすごく好きだってこと！ 忘れなかったよね？ 連絡が取れなくても··· 待ってくれてありがとう。 君が私に出会ったことが、花が満開に咲くきっかけになりますように···
            <div style = "text-align: right; margin-top: 40px; font-weight: bold; color: #795548">
                - '나에'게 온 하랑이에게, 운로가. </div>`
        

        const colorThemes = [
            { bg: "#fff9c4", border: "#fbc02d" }, // 레몬
            { bg: "#ffe0b2", border: "#ffa726" }, // 피치
            { bg: "#e1f5fe", border: "#4fc3f7" }, // 하늘
            { bg: "#e8f5e9", border: "#81c784" }, // 민트
            { bg: "#f3e5f5", border: "#ba68c8" }, // 연보라
            { bg: "#fce4ec", border: "#f06292" }  // 핑크
        ];

        let currentPage = 1;

        function renderBoard() 
        {
            const board = document.getElementById('rolling-paper-board');
            if (!board) return;

            board.innerHTML = '';
            
            try
            {
                // [1페이지 렌더링]: 포스트잇 목록 생성
                if (currentPage === 1) 
                {
                    stictyMessages.forEach((item, index) => 
                    {
                        const messageEl = document.createElement('div');
                        messageEl.className = 'message';

                        messageEl.innerHTML = `
                        <div style="flex-grow: 1; width: 100%;">${item.text}</div>
                        <div style="width: 100%; text-align: right; margin-top: 10px; font-weight: bold; color: #555;">- ${item.author}</div>
                        `;
            
                        // 색상 테마 배정
                        const theme = colorThemes[index % colorThemes.length];
                        messageEl.style.backgroundColor = theme.bg;
                        messageEl.style.borderBottom = `3px solid ${theme.border}`;

                        // 자연스러운 손맛을 위한 미세 오차 부여 (회전 -6~6도, 상하 미세이동 -8~8px)
                        const rotate = (Math.random() - 0.5) * 12;
                        const translateY = (Math.random() - 0.5) * 16;
                    
                        messageEl.style.transform = `translateY(${translateY}px) rotate(${rotate}deg)`;

                        // 마우스 호버 인터랙션
                        messageEl.addEventListener('mouseenter', () => {
                            messageEl.style.transform = `translateY(${translateY - 5}px) rotate(${rotate}deg) scale(1.06)`;
                        });
                        messageEl.addEventListener('mouseleave', () => {
                            messageEl.style.transform = `translateY(${translateY}px) rotate(${rotate}deg) scale(1)`;
                        });

                        board.appendChild(messageEl);
                    });

                } 
               
                else if (currentPage === 2) 
                {
                    // [2페이지 렌더링]: 긴 편지 하나만 생성
                    const letterEl = document.createElement('div');
                    letterEl.className = 'long-letter';

                    // HTML로 앞뒤 공백을 자르고 렌더링
                    letterEl.innerHTML = longLetter.trim();

                    board.appendChild(letterEl)
                }
            }

            catch (error)
            {
                board.innerHTML = `<div style="color:red; font-size:18px;">
                    렌더링 중 에러 발생: ${error.message}</div>`;
            }

            updadePaginationUI();
        }

        function updadePaginationUI()
        {
            const pageInfo = document.getElementById('page-info');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            if (pageInfo) pageInfo.innerText = `${currentPage} / 2`;
            if (prevBtn) prevBtn.disabled = (currentPage === 1);
            if (nextBtn) nextBtn.disabled = (currentPage === 2);
        }

        function changePage(pageNum)
        {
            currentPage = pageNum;
            renderBoard();
        }

        window.addEventListener('load', renderBoard);
    </script>
</body>
</html>
